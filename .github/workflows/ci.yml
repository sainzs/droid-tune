name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run check
      - run: node scripts/check-demo-table.js
      - run: node bin/droidtune.js triforce
        env:
          CI: 'true'
