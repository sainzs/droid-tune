<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>droid-tune — social card</title>
  <!-- Static 1200x630 Open Graph card. Render headless to og.png:
       screenshot at exactly 1200x630, no device scale factor. -->
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 64px 48px;
      background: #020202;
      color: #d6d3d2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Same faded technical grid as the site hero. */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(214, 211, 210, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(214, 211, 210, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 90% at 12% 0%, #000 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 90% at 12% 0%, #000 0%, transparent 75%);
      pointer-events: none;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 32px;
      font-weight: 700;
      color: #f5f5f5;
      letter-spacing: -0.5px;
    }

    .wordmark .prompt { color: #ef6f2e; }

    /* Squared orange tick, same gesture as the site kicker. */
    .tick {
      width: 18px;
      height: 18px;
      background: #ef6f2e;
    }

    .middle { position: relative; }

    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 19px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a49d9a;
    }

    .kicker::before {
      content: "";
      flex: none;
      width: 11px;
      height: 11px;
      background: #ef6f2e;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 84px;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #f5f5f5;
    }

    .support {
      margin: 0;
      font-size: 27px;
      color: #a49d9a;
    }

    .foot {
      position: relative;
      border-top: 1px solid #2e2c2b;
      padding-top: 22px;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 17px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #5c5855;
    }
  </style>
</head>
<body>
  <div class="top">
    <span class="wordmark"><span class="prompt">$</span> droid-tune</span>
    <span class="tick" aria-hidden="true"></span>
  </div>

  <div class="middle">
    <p class="kicker">Open-source measurement harness for Factory Droid agents</p>
    <h1>Grade the commit,<br>not the narration.</h1>
    <p class="support">Deterministic behavioral tests. An evidence pack for every attempt.</p>
  </div>

  <div class="foot">Unofficial community project. Not affiliated with Factory.</div>
</body>
</html>
